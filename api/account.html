<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Akun — AZRYLPREMIUM</title><link rel="stylesheet" href="/style.css"></head><body><main class="container"><div class="card form-card"><a class="brand" href="/dashboard.html">AZRYL<span>PREMIUM</span></a><h1>Akun</h1><div id="info" class="list"></div><button id="logout" class="btn danger full">LOGOUT</button></div></main><script type="module">
import {auth,db} from "/firebase.js";import {onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";import {doc,getDoc} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
onAuthStateChanged(auth,async u=>{if(!u)return location.href="/login.html";const s=await getDoc(doc(db,"users",u.uid));const d=s.data();info.innerHTML=`<div class="row"><span>Username</span><b>${d.username||"-"}</b></div><div class="row"><span>Email</span><b>${u.email}</b></div><div class="row"><span>Saldo</span><b>${d.balance||0}P</b></div><div class="row"><span>Total Pesanan</span><b>${d.totalOrders||0}</b></div>`});logout.onclick=()=>signOut(auth).then(()=>location.href="/");
</script></body></html>
