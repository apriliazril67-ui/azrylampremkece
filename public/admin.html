<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — AZRYLPREMIUM</title><link rel="stylesheet" href="/style.css"></head><body><header class="container nav"><a class="brand" href="/">AZRYL<span>PREMIUM</span></a><button id="logout" class="btn secondary">Logout</button></header><main class="container dashboard"><div class="grid"><div class="card"><span class="muted">USERS</span><div id="users" class="balance">—</div></div><div class="card"><span class="muted">ORDERS</span><div id="orders" class="balance">—</div></div><div class="card"><span class="muted">STOCK</span><div id="stock" class="balance">—</div></div></div><div class="card" style="margin-top:18px"><h2>Top Up Pending</h2><div id="topups" class="list">Memuat...</div></div><div class="card" style="margin-top:18px"><h2>Tambah Stock</h2><form id="stockForm"><input id="secretValue" class="input" placeholder="Kode/item premium" required><button class="btn">TAMBAH STOCK</button></form></div></main><div id="toast" class="toast"></div><script type="module">
import {auth,db} from "/firebase.js";import {onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";import {doc,getDoc,collection,getDocs,query,where,orderBy,serverTimestamp,addDoc,getCountFromServer} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const toast=m=>{const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),3000)};let admin;
async function refresh(){for(const [id,c] of [["users","users"],["orders","orders"],["stock","stock"]]){const s=await getCountFromServer(collection(db,c));document.getElementById(id).textContent=s.data().count}const q=query(collection(db,"topups"),where("status","==","pending"),orderBy("createdAt","desc"));const s=await getDocs(q);topups.innerHTML=s.empty?'<p class="muted">Tidak ada top up pending.</p>':s.docs.map(x=>{const d=x.data();return `<div class="row"><div><b>${d.amount}P</b><div class="muted">${d.senderName||"-"} • ${d.userId.slice(0,10)}</div></div><div style="display:flex;gap:8px"><button class="btn" data-id="${x.id}" data-action="approve">APPROVE</button><button class="btn danger" data-id="${x.id}" data-action="reject">REJECT</button></div></div>`}).join("")}
onAuthStateChanged(auth,async u=>{if(!u)return location.href="/login.html";admin=u;const s=await getDoc(doc(db,"users",u.uid));if(!s.exists()||s.data().role!=="admin"){toast("Akses admin ditolak.");setTimeout(()=>location.href="/dashboard.html",900);return}refresh()});
topups.onclick=async e=>{const b=e.target.closest("button[data-id]");if(!b)return;b.disabled=true;try{const token=await admin.getIdToken();const r=await fetch(`/api/admin/${b.dataset.action}-topup`,{method:"POST",headers:{"Authorization":`Bearer ${token}`,"Content-Type":"application/json"},body:JSON.stringify({topupId:b.dataset.id})});const j=await r.json();if(!r.ok||!j.success)throw Error(j.message);toast(j.message);refresh()}catch(e){toast(e.message)}finally{b.disabled=false}};
stockForm.onsubmit=async e=>{e.preventDefault();try{await addDoc(collection(db,"stock"),{productId:"am-premium",secretValue:secretValue.value.trim(),status:"available",createdAt:serverTimestamp()});secretValue.value="";toast("Stock ditambahkan.");refresh()}catch(e){toast("Gagal menambah stock.")}};
logout.onclick=()=>signOut(auth).then(()=>location.href="/");
</script></body></html>
