<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — AZRYLPREMIUM</title><link rel="stylesheet" href="/style.css"></head><body><header class="container nav"><a class="brand" href="/">AZRYL<span>PREMIUM</span></a><nav class="navlinks"><a href="/topup.html">Top Up</a><a href="/orders.html">Pesanan</a><button id="logout" class="btn secondary">Logout</button></nav></header><main class="container dashboard"><div class="grid"><div class="card"><span class="muted">SALDO</span><div id="balance" class="balance">—</div></div><div class="card"><span class="muted">PESANAN</span><div id="orders" class="balance">—</div></div><div class="card"><span class="muted">STATUS</span><div id="status" class="balance" style="font-size:25px">—</div></div></div><section class="card" style="margin-top:18px"><span class="badge">PRODUCT</span><h1>AM Premium</h1><div class="price">500P</div><p class="muted">Stok tersedia: <b id="stock">—</b></p><button id="buy" class="btn">BELI AM PREMIUM</button><div id="result" class="result"><h3>Pesanan berhasil</h3><div id="item" class="mono"></div><button id="copy" class="btn secondary">COPY</button></div></section></main><div id="toast" class="toast"></div><script type="module">
import {auth,db} from "/firebase.js";import {onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";import {doc,getDoc,collection,getCountFromServer} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const toast=m=>{const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),3000)};let user;
onAuthStateChanged(auth,async u=>{if(!u)return location.href="/login.html";user=u;const s=await getDoc(doc(db,"users",u.uid));if(!s.exists())return signOut(auth);const d=s.data();balance.textContent=`${d.balance||0}P`;orders.textContent=d.totalOrders||0;status.textContent=(d.status||"active").toUpperCase();const c=await getCountFromServer(collection(db,"stock"));stock.textContent=c.data().count});
logout.onclick=()=>signOut(auth).then(()=>location.href="/");
buy.onclick=async()=>{buy.disabled=true;buy.textContent="MEMPROSES...";try{const token=await user.getIdToken();const r=await fetch("/api/purchase",{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${token}`},body:JSON.stringify({productId:"am-premium"})});const j=await r.json();if(!r.ok||!j.success)throw new Error(j.message||"Gagal");item.textContent=j.data.item;document.getElementById("result").classList.add("show");toast("Pembelian berhasil.")}catch(e){toast(e.message)}finally{buy.disabled=false;buy.textContent="BELI AM PREMIUM"}};
copy.onclick=()=>navigator.clipboard.writeText(item.textContent).then(()=>toast("Item disalin."));
</script></body></html>
