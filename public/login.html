<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — AZRYLPREMIUM</title><link rel="stylesheet" href="/style.css"></head><body><main class="container"><div class="card form-card"><a class="brand" href="/">AZRYL<span>PREMIUM</span></a><h1>Masuk</h1><p class="muted">Masuk ke dashboard kamu.</p><form id="loginForm"><label>Email</label><input id="email" class="input" type="email" required autocomplete="email"><label>Password</label><input id="password" class="input" type="password" required autocomplete="current-password"><button class="btn full" id="submit">LOGIN</button></form><p class="muted">Belum punya akun? <a href="/register.html">Daftar</a></p></div></main><div id="toast" class="toast"></div><script type="module">
import {auth,db} from "/firebase.js";import {signInWithEmailAndPassword,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";import {doc,getDoc} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const toast=(m)=>{const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2800)};
onAuthStateChanged(auth,async u=>{if(u){const s=await getDoc(doc(db,"users",u.uid));location.href=s.exists()&&s.data().role==="admin"?"/admin.html":"/dashboard.html"}});
loginForm.onsubmit=async e=>{e.preventDefault();submit.disabled=true;try{await signInWithEmailAndPassword(auth,email.value.trim(),password.value);location.href="/dashboard.html"}catch(e){toast("Email atau password salah.")}finally{submit.disabled=false}}
</script></body></html>
