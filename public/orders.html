<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pesanan — AZRYLPREMIUM</title><link rel="stylesheet" href="/style.css"></head><body><header class="container nav"><a class="brand" href="/dashboard.html">AZRYL<span>PREMIUM</span></a><a class="btn secondary" href="/dashboard.html">Dashboard</a></header><main class="container dashboard"><div class="card"><h1>Riwayat Pesanan</h1><div id="list" class="list">Memuat...</div></div></main><script type="module">
import {auth,db} from "/firebase.js";import {onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";import {collection,query,where,orderBy,getDocs} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
onAuthStateChanged(auth,async u=>{if(!u)return location.href="/login.html";try{const q=query(collection(db,"orders"),where("userId","==",u.uid),orderBy("createdAt","desc"));const s=await getDocs(q);list.innerHTML=s.empty?'<p class="muted">Belum ada pesanan.</p>':s.docs.map(x=>{const d=x.data();return `<div class="row"><div><b>#${x.id.slice(0,10)}</b><div class="muted">AM Premium • ${d.price}P</div></div><span class="pill">${d.status}</span></div>`}).join("")}catch(e){list.innerHTML='<p class="muted">Belum ada pesanan atau index Firestore belum dibuat.</p>'}});
</script></body></html>
