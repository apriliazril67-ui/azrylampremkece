<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar — AZRYLPREMIUM</title><link rel="stylesheet" href="/style.css"></head><body><main class="container"><div class="card form-card"><a class="brand" href="/">AZRYL<span>PREMIUM</span></a><h1>Buat Akun</h1><form id="regForm"><label>Username</label><input id="username" class="input" required minlength="3" maxlength="30"><label>Email</label><input id="email" class="input" type="email" required><label>Password</label><input id="password" class="input" type="password" required minlength="6"><label>Konfirmasi Password</label><input id="confirm" class="input" type="password" required minlength="6"><button class="btn full" id="submit">DAFTAR</button></form><p class="muted">Sudah punya akun? <a href="/login.html">Login</a></p></div></main><div id="toast" class="toast"></div><script type="module">
import {auth,db} from "/firebase.js";import {createUserWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";import {doc,setDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const toast=m=>{const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),3000)};
regForm.onsubmit=async e=>{e.preventDefault();if(password.value!==confirm.value)return toast("Konfirmasi password tidak sama.");submit.disabled=true;try{const c=await createUserWithEmailAndPassword(auth,email.value.trim(),password.value);await setDoc(doc(db,"users",c.user.uid),{username:username.value.trim(),email:email.value.trim(),balance:0,role:"user",status:"active",totalOrders:0,createdAt:serverTimestamp()});location.href="/dashboard.html"}catch(e){toast("Gagal membuat akun. Periksa email/password.")}finally{submit.disabled=false}}
</script></body></html>
