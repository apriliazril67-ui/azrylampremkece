<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Top Up — AZRYLPREMIUM</title><link rel="stylesheet" href="/style.css"></head><body><header class="container nav"><a class="brand" href="/dashboard.html">AZRYL<span>PREMIUM</span></a><a class="btn secondary" href="/dashboard.html">Dashboard</a></header><main class="container"><div class="card form-card"><h1>Top Up Saldo</h1><img class="qr" src="https://cdn.phototourl.com/member/2026-08-28-6ea19a2e-2da8-4bab-a60f-a909864506cf.jpg" alt="QR pembayaran"><p><b>DANA:</b> 085786683784 (JEJE)</p><p class="muted">Minimum top up 1.000P. Setelah transfer, isi data berikut. Top up dikonfirmasi manual admin dalam sekitar 1–3 menit.</p><form id="form"><label>Nominal</label><input id="amount" class="input" type="number" min="1000" step="1" required><label>Nama Pengirim</label><input id="senderName" class="input" maxlength="80" required><button class="btn full" id="submit">KONFIRMASI TOP UP</button></form></div></main><div id="toast" class="toast"></div><script type="module">
import {auth,db} from "/firebase.js";import {onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";import {collection,addDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
let user;const toast=m=>{const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),3000)};
onAuthStateChanged(auth,u=>{if(!u)location.href="/login.html";else user=u});
form.onsubmit=async e=>{e.preventDefault();if(+amount.value<1000)return toast("Minimum top up 1.000P.");submit.disabled=true;try{await addDoc(collection(db,"topups"),{userId:user.uid,amount:+amount.value,senderName:senderName.value.trim(),status:"pending",createdAt:serverTimestamp()});toast("Top up terkirim. Tunggu konfirmasi admin.");form.reset()}catch(e){toast("Gagal mengirim top up.")}finally{submit.disabled=false}}
</script></body></html>
